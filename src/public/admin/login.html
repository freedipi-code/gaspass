<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Admin Access — Canna Express</title>
  <link rel="icon" href="data:,">
  <style>
    :root{color-scheme:dark;--primary:#9d4edd;--secondary:#4cc9f0;--text:#f3f0fc;--muted:#a5a1b8;--line:#ffffff16}*{box-sizing:border-box}body{min-height:100vh;margin:0;padding:24px;display:grid;place-items:center;background:radial-gradient(circle at 20% 10%,#29134a 0,transparent 34%),linear-gradient(135deg,#0f0c20,#15102a 52%,#060210);color:var(--text);font:500 16px/1.5 system-ui,-apple-system,sans-serif}.login-card{width:min(440px,100%);padding:38px;border:1px solid var(--line);border-radius:22px;background:#191232c7;box-shadow:0 30px 90px #0008;backdrop-filter:blur(20px)}.mark{width:54px;height:54px;display:grid;place-items:center;border-radius:16px;background:linear-gradient(135deg,var(--primary),#b5179e);font-weight:800;box-shadow:0 12px 30px #9d4edd55}.eyebrow{margin:28px 0 7px;color:var(--secondary);font-size:11px;font-weight:800;letter-spacing:.14em}h1{margin:0;font-size:32px;line-height:1.1}p{margin:12px 0 26px;color:var(--muted);font-size:14px}.login-error{display:none;margin:0 0 18px;padding:11px 13px;border:1px solid #ff4d6d66;border-radius:10px;background:#ff4d6d17;color:#ff91a5;font-size:12px}.login-error:target{display:block}label{display:flex;flex-direction:column;gap:8px;color:var(--muted);font-size:12px}input{height:50px;padding:0 15px;border:1px solid var(--line);border-radius:11px;background:#ffffff0d;color:var(--text);font:inherit;outline:0}input:focus{border-color:var(--secondary);box-shadow:0 0 0 3px #4cc9f024}button{width:100%;height:50px;margin-top:18px;border:0;border-radius:11px;background:linear-gradient(135deg,var(--primary),#b5179e);color:#fff;font:700 14px inherit;cursor:pointer;box-shadow:0 12px 28px #9d4edd45}.security{margin:20px 0 0;padding-top:18px;border-top:1px solid var(--line);font-size:11px;text-align:center}
  </style>
</head>
<body>
  <main class="login-card">
    <div class="mark">CE</div>
    <div class="eyebrow">PROTECTED AREA</div>
    <h1>Admin access</h1>
    <p>Enter the administrator password to continue to the dashboard.</p>
    <div class="login-error" id="error">Incorrect password. Please try again.</div>
    <form method="post" action="/admin/login">
      <label for="password">Administrator password<input id="password" name="password" type="password" required autofocus autocomplete="current-password" maxlength="200"></label>
      <button type="submit">Unlock dashboard</button>
    </form>
    <p class="security">Session protected with a signed, HttpOnly cookie.</p>
  </main>
</body>
</html>
